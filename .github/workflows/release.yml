name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to build, such as v1.0.1"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
        working-directory: app
      - run: python scripts/sidecar.py
      - run: npx tauri build --bundles nsis --no-sign
        working-directory: app
      - name: Checksums
        shell: bash
        working-directory: target/release/bundle/nsis
        run: sha256sum ./*-setup.exe > SHA256SUMS
      - name: Publish
        shell: bash
        working-directory: target/release/bundle/nsis
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Klipu $TAG" --generate-notes
          gh release upload "$TAG" ./*-setup.exe SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
